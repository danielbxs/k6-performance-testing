name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Start Ticket Center API
        run: npm run api > api.log 2>&1 &
      - name: Wait for API health status
        run: |
          for attempt in {1..10}; do
            curl --fail --silent http://127.0.0.1:3000/health && exit 0
            sleep 1
          done
          exit 1
      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.2.0

      - name: Run smoke test
        run: npm run smoke -- --summary-export results/smoke-summary.json

      - name: Run load test
        run: npm run load -- --summary-export results/load-summary.json

      - name: Upload test summaries to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-summaries
          path: results/*-summary.json
